name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test
        env:
          SIMULATION_MATCH_COUNT: 1000

  # 10 000 matchs uniquement sur pull request : trop coûteux à chaque commit.
  #
  # V0.61 : ce job lançait `tests/simulation`, un dossier qui n'a jamais existé,
  # et échouait donc sur « No test files found » à chaque pull request depuis le
  # premier commit. La suite existe désormais, et `SIMULATION_MATCH_COUNT` est
  # réellement lue : elle fixe la taille de l'échantillon, et les bornes des
  # tests s'élargissent du bruit correspondant.
  test-simulation-deep:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:simulate
        env:
          SIMULATION_MATCH_COUNT: 10000
      # La calibration est obligatoire avant toute pull request d'après les
      # règles du projet : autant que le pipeline l'exige plutôt que la mémoire.
      - run: npm run calibrate
